<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f0f4ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Juliette and the Musketeers! 🎭</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Nunito', sans-serif;
      background: #08061a;
      min-height: 100vh;
      min-height: 100dvh;
      color: #1e293b;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* ── Stage backdrop + spotlight ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 55% at 50% -5%,  rgba(255,215,80,.22) 0%, rgba(255,160,30,.06) 45%, transparent 70%),
        radial-gradient(ellipse 90% 40% at 50% 105%, rgba(120,60,200,.18) 0%, transparent 60%),
        linear-gradient(180deg, #08061a 0%, #0e0830 40%, #130a38 65%, #08061a 100%);
      pointer-events: none;
      z-index: -2;
    }

    /* ── Side curtains ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(90deg,
          rgba(90,8,18,1)   0%,
          rgba(110,10,22,.8) 2.5%,
          rgba(80,5,15,.4)  6%,
          transparent       14%
        ),
        linear-gradient(270deg,
          rgba(90,8,18,1)   0%,
          rgba(110,10,22,.8) 2.5%,
          rgba(80,5,15,.4)  6%,
          transparent       14%
        );
      pointer-events: none;
      z-index: -1;
    }

    /* ── Musketeer deco elements ── */
    .stage-deco {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }
    .stage-deco-item {
      position: absolute;
      line-height: 1;
      user-select: none;
      transform-origin: center;
    }
    @keyframes decoFloat {
      0%, 100% { transform: var(--base-transform) translateY(0px); }
      50%       { transform: var(--base-transform) translateY(-10px); }
    }

    /* ── Twinkling stars ── */
    .stage-stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }
    .stage-star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: starTwinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: var(--lo, .1); transform: scale(1); }
      50%       { opacity: var(--hi, .7); transform: scale(1.4); }
    }
    /* ── Graduation celebration animation ── */
    .grad-celebration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;   /* stars + confetti: above content */
      overflow: hidden;
      transition: opacity 0.5s ease;
    }
    .grad-caps-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;    /* caps: below main content */
      overflow: hidden;
      transition: opacity 0.5s ease;
    }

    /* Stars: born at top, fall downward */
    .grad-star {
      position: absolute;
      top: -5%;
      left: var(--x, 50%);
      font-size: var(--sz, 16px);
      line-height: 1;
      animation: starFall var(--dur, 3s) ease-in var(--delay, 0s) infinite both;
      will-change: transform, opacity;
    }
    @keyframes starFall {
      0%   { transform: translateY(0) translateX(0) scale(0); opacity: 0; }
      12%  { opacity: 1; transform: translateY(20px) translateX(0) scale(1.2); }
      85%  { opacity: .85; }
      100% { transform: translateY(var(--dy, 300px)) translateX(var(--dx, 0px)) scale(.6); opacity: 0; }
    }

    /* Confetti: also from top, falling */
    .grad-piece {
      position: absolute;
      top: -2%;
      left: var(--x, 50%);
      animation: confFall var(--dur, 2.5s) ease-in var(--delay, 0s) infinite both;
      will-change: transform, opacity;
    }
    @keyframes confFall {
      0%   { transform: translateY(0) translateX(0) rotate(0deg) scale(1); opacity: 1; }
      80%  { opacity: .8; }
      100% { transform: translateY(var(--dy, 250px)) translateX(var(--dx, 30px)) rotate(var(--rot, 360deg)) scale(.3); opacity: 0; }
    }

    /* Caps: born near nav area, fly upward */
    .grad-cap-fly {
      position: absolute;
      top: var(--from-top, 52vh);
      left: var(--x, 50%);
      font-size: var(--sz, 24px);
      line-height: 1;
      animation: capUp var(--dur, 3s) ease-out var(--delay, 0s) infinite both;
      will-change: transform, opacity;
    }
    @keyframes capUp {
      0%   { transform: translateY(0) translateX(0) scale(0) rotate(0deg); opacity: 0; }
      15%  { transform: translateY(-25px) translateX(0) scale(1.3) rotate(-8deg); opacity: 1; }
      85%  { opacity: .8; }
      100% { transform: translateY(var(--dy, -280px)) translateX(var(--dx, 20px)) scale(.55) rotate(var(--rot, 25deg)); opacity: 0; }
    }

    button {
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible { outline: 3px solid #6366f1; outline-offset: 3px; }

    .app-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 16px calc(36px + env(safe-area-inset-bottom));
      position: relative;
      z-index: 2;
    }
    @media (max-width: 480px) {
      .app-wrap { padding: 0 10px calc(24px + env(safe-area-inset-bottom)); }
    }

    /* ── Header ── */
    .app-header { text-align: center; padding: 28px 16px 20px; }
    .banner-stars {
      display: flex; justify-content: center; gap: 6px; margin-bottom: 10px;
    }
    .banner-star {
      font-size: clamp(14px, 3vw, 20px);
      display: inline-block;
      animation: starFloat 2.2s ease-in-out infinite;
    }
    .header-main-emoji {
      font-size: clamp(48px, 12vw, 72px);
      display: block;
      margin-bottom: 10px;
      animation: heroFloat 3.5s ease-in-out infinite;
    }
    .app-title {
      font-size: clamp(22px, 6vw, 40px);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #F59E0B 0%, #EC4899 35%, #8B5CF6 65%, #3B82F6 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradShift 5s ease infinite;
    }
    .app-subtitle {
      font-size: clamp(13px, 3vw, 16px);
      font-weight: 800;
      color: rgba(255,255,255,0.7);
      margin-bottom: 4px;
    }
    .app-motto {
      font-size: clamp(12px, 2.5vw, 14px);
      font-weight: 700;
      color: rgba(255,255,255,0.45);
    }
    @media (max-width: 480px) { .app-header { padding: 16px 8px 12px; } }

    /* ── Tab nav ── */
    .tab-nav {
      background: #fff;
      border-radius: 18px;
      padding: 12px 12px 10px;
      box-shadow: 0 2px 18px rgba(0,0,0,.09);
      margin-bottom: 16px;
      position: sticky;
      top: 6px;
      z-index: 100;
    }

    /* Mobile collapse toggle */
    .filter-toggle {
      display: none;
    }
    .filter-body {
      /* always visible on desktop */
    }
    @media (max-width: 640px) {
      .tab-nav { padding: 10px 10px 8px; }
      .filter-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        background: none;
        border: none;
        padding: 2px 2px 0;
        cursor: pointer;
        gap: 8px;
        -webkit-tap-highlight-color: transparent;
      }
      .filter-toggle-left {
        display: flex; align-items: center; gap: 8px;
        font-size: 14px; font-weight: 800; color: #1e293b;
      }
      .filter-toggle-chip {
        font-size: 12px; font-weight: 800;
        padding: 3px 10px; border-radius: 999px;
        background: #f1f5f9; color: #475569;
        white-space: nowrap; max-width: 160px;
        overflow: hidden; text-overflow: ellipsis;
      }
      .filter-toggle-chip.active {
        background: var(--chip-color, #1e293b);
        color: #fff;
      }
      .filter-toggle-chevron {
        font-size: 12px; color: #94a3b8;
        transition: transform .25s ease;
        flex-shrink: 0;
      }
      .filter-toggle-chevron.open { transform: rotate(180deg); }
      .filter-body {
        overflow: hidden;
        max-height: 0;
        transition: max-height .3s ease, opacity .25s ease;
        opacity: 0;
      }
      .filter-body.is-open {
        max-height: 500px;
        opacity: 1;
      }
      .filter-body-inner { padding-top: 10px; }
    }
    @media (min-width: 641px) {
      .filter-toggle { display: none !important; }
    }

    .nav-label {
      font-size: 10px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: #94a3b8; margin-bottom: 7px; padding-left: 2px;
    }
    /* Group row — 3-column grid */
    .tab-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .tab-btn {
      display: flex; align-items: center; justify-content: center;
      gap: 5px; text-align: center;
      padding: 10px 8px;
      border-radius: 14px;
      font-size: clamp(12px, 3vw, 14px);
      font-weight: 800;
      border: 2px solid;
      line-height: 1.25;
      transition: background .18s, color .18s, border-color .18s, transform .1s, box-shadow .18s;
      min-height: 44px;
    }
    .tab-btn-all {
      grid-column: 1 / -1;  /* spans all 3 columns */
      border-radius: 12px;
    }
    .tab-btn:active { transform: scale(.93); }

    /* Scene row — equal-width cards in one row */
    .scene-bar-divider { height: 1.5px; background: #f1f5f9; margin: 10px 0; }
    .scene-bar {
      display: flex; gap: 5px;
    }
    .scene-btn {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px;
      padding: 8px 2px;
      border-radius: 14px;
      border: 2px solid;
      min-height: 60px;
      transition: background .15s, color .15s, border-color .15s, transform .1s, box-shadow .15s;
    }
    .scene-btn:active { transform: scale(.91); }
    .scene-btn-num {
      font-size: clamp(15px, 4vw, 18px); font-weight: 900; line-height: 1;
    }
    .scene-btn-emoji { font-size: clamp(16px, 4.5vw, 20px); line-height: 1; }

    /* ── Group banner ── */
    .group-banner {
      border-radius: 16px;
      padding: 16px 20px;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .group-banner-emoji { font-size: clamp(30px, 8vw, 44px); flex-shrink: 0; }
    .group-banner-title {
      font-size: clamp(18px, 5vw, 26px);
      font-weight: 900;
      line-height: 1.2;
    }
    .group-banner-sub {
      font-size: clamp(12px, 2.8vw, 14px);
      font-weight: 700;
      color: #64748b;
      margin-top: 3px;
    }

    /* ── Scene card ── */
    .scene-card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 28px rgba(0,0,0,.08);
      margin-bottom: 16px;
    }
    @media (max-width: 480px) { .scene-card { border-radius: 16px; padding: 14px 12px; } }

    .scene-card-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 2px solid #f1f5f9;
    }
    .scene-num-badge {
      width: 42px; height: 42px;
      border-radius: 12px;
      color: #fff;
      font-size: 19px;
      font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .scene-title {
      font-size: clamp(16px, 4.5vw, 22px);
      font-weight: 900;
      color: #1e293b;
      line-height: 1.3;
      margin-bottom: 7px;
    }
    .scene-meta {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    }

    /* ── Chips ── */
    .group-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 800;
      border: 1.5px solid transparent;
      white-space: nowrap;
    }
    .count-chip {
      padding: 3px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
      background: #f1f5f9; color: #64748b;
    }

    /* ── Scene play bar ── */
    .scene-play-bar {
      display: flex; gap: 8px;
      padding: 10px 0 14px;
      margin-bottom: 4px;
    }
    .scene-seq-btn {
      flex: 1;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 8px;
      border-radius: 12px;
      border-width: 2px; border-style: solid;
      font-family: 'Nunito', sans-serif;
      font-size: clamp(13px, 3vw, 15px);
      font-weight: 800;
      min-height: 46px;
      transition: opacity .15s, transform .1s;
    }
    .scene-seq-btn:not(:disabled):active { transform: scale(.96); }
    .scene-seq-btn:disabled { opacity: .4; cursor: default; }
    .scene-seq-stop {
      flex: 1;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 8px;
      border-radius: 12px;
      border-width: 2px; border-style: solid;
      font-family: 'Nunito', sans-serif;
      font-size: clamp(13px, 3vw, 15px);
      font-weight: 800;
      min-height: 46px;
      background: transparent;
      animation: pulse .9s ease-in-out infinite;
    }

    /* ── Scene items ── */
    .scene-items { display: flex; flex-direction: column; gap: 10px; }

    /* ── Line bubble ── */
    .line-bubble {
      border-radius: 14px;
      padding: 12px 14px;
      border: 2px solid transparent;
      border-left-width: 5px;
      cursor: pointer;
      transition: background .15s, border-color .15s, box-shadow .15s, opacity .15s, transform .1s;
      user-select: none;
      touch-action: manipulation;
    }
    .line-bubble:active { transform: scale(.98); }
    .line-bubble.is-dimmed { opacity: 0.35; }
    .line-bubble-top {
      display: flex; align-items: center;
      justify-content: space-between;
      gap: 8px; margin-bottom: 8px;
    }
    .line-text {
      font-size: clamp(17px, 4.5vw, 22px);
      font-weight: 800;
      color: #1e293b;
      line-height: 1.5;
    }
    @media (max-width: 480px) {
      .line-bubble { padding: 10px 11px; }
    }

    /* ── Stage direction ── */
    .stage-direction {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .stage-direction-text {
      font-size: clamp(14px, 3.5vw, 17px);
      font-weight: 700;
      font-style: italic;
      color: #64748b;
    }

    /* ── Song cue ── */
    .song-cue {
      border-radius: 14px;
      padding: 14px 16px;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .song-cue-info { display: flex; align-items: center; gap: 10px; }
    .song-cue-emoji { font-size: clamp(22px, 5vw, 30px); }
    .song-cue-label {
      font-size: 11px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 2px;
    }
    .song-cue-title {
      font-size: clamp(15px, 4vw, 18px);
      font-weight: 900;
    }

    /* ── Buttons ── */
    .audio-play-btn {
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 9px;
      border-width: 2.5px; border-style: solid;
      font-size: 15px;
      transition: background .15s, color .15s, transform .1s;
      flex-shrink: 0;
      width: 36px; height: 36px;
    }
    .audio-play-btn:not(:disabled):active { transform: scale(.88); }

    .song-play-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: clamp(13px, 3.2vw, 15px);
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      border-width: 2.5px; border-style: solid;
      transition: all .15s;
      min-height: 42px;
      white-space: nowrap;
    }
    .song-play-btn:not(:disabled):active { transform: scale(.96); }
    .song-play-btn:disabled { cursor: default; }

    /* ── Animations ── */
    @keyframes heroFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30%       { transform: translateY(-12px) rotate(8deg); }
      65%       { transform: translateY(-6px) rotate(-5deg); }
    }
    @keyframes starFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.55; }
      50%       { transform: translateY(-11px) scale(1.35); opacity: 1; }
    }
    @keyframes gradShift {
      0%, 100% { background-position: 0% 50%; }
      50%       { background-position: 100% 50%; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .6; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      0%   { transform: scale(0.82); opacity: 0; }
      70%  { transform: scale(1.07); }
      100% { transform: scale(1);    opacity: 1; }
    }
    .anim-pulse   { animation: pulse   .8s ease infinite; }
    .anim-slideUp { animation: slideUp .32s ease both; }
    .anim-pop     { animation: pop     .3s cubic-bezier(.34,1.56,.64,1) both; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback } = React;

const GROUPS = {
  captains:       { label: 'Captains',        short: 'Captains',   emoji: '👑', color: '#D97706', bg: '#FFFBEB', border: '#FDE68A' },
  bumblebeeBoys:  { label: 'Bumblebee Boys',  short: 'BB Boys',    emoji: '🐝', color: '#CA8A04', bg: '#FEFCE8', border: '#FEF08A' },
  bumblebeeGirls: { label: 'Bumblebee Girls', short: 'BB Girls',   emoji: '🌸', color: '#DB2777', bg: '#FDF2F8', border: '#FBCFE8' },
  butterflyBoys:  { label: 'Butterfly Boys',  short: 'BF Boys',    emoji: '🦋', color: '#2563EB', bg: '#EFF6FF', border: '#BFDBFE' },
  butterflyGirls: { label: 'Butterfly Girls', short: 'BF Girls',   emoji: '🌺', color: '#7C3AED', bg: '#F5F3FF', border: '#DDD6FE' },
  all:            { label: 'All Students',    short: 'All Kids',   emoji: '🌟', color: '#059669', bg: '#ECFDF5', border: '#A7F3D0' },
};

const SCENES = [
  {
    id: 's1', num: 1, title: 'Entrance', emoji: '🚪',
    groups: ['captains'],
    items: [
      { type: 'line', group: 'captains', text: 'Musketeers move forward!',       audio: 'voice/s1/Musketeers move forward.mp3' },
      { type: 'line', group: 'captains', text: 'Musketeers attention!',           audio: 'voice/s1/Musketeers attention.mp3' },
      { type: 'line', group: 'captains', text: 'Musketeers address the parents!', audio: 'voice/s1/Musketeers address the parents.mp3' },
    ],
  },
  {
    id: 's2', num: 2, title: 'Introduction', emoji: '🎭',
    groups: ['all'],
    items: [
      { type: 'line', group: 'all', text: 'Dear parents! Today we will tell you the story of a great hero who fought for honor, loyalty, and friendship… and also found love.', audio: 'voice/s2/Dear parents.mp3' },
      { type: 'direction', text: 'Change positions.' },
      { type: 'line', group: 'all', text: "It is a tale about the spirit of 'ONE FOR ALL AND ALL FOR ONE'... ON GUARD!", audio: 'voice/s2/It is a tale about.mp3' },
    ],
  },
  {
    id: 's3', num: 3, title: 'Dogtanian Gets Ready to Rumble!', emoji: '⚔️',
    groups: ['bumblebeeBoys'],
    items: [
      { type: 'line', group: 'bumblebeeBoys', text: 'Dogtanian goes to Paris to be a musketeer!',                                      audio: 'voice/s3/Dogtanian goes to Paris to be a musketeer.mp3' },
      { type: 'line', group: 'bumblebeeBoys', text: 'Oh no!',                                                                           audio: 'voice/s3/Oh no.mp3' },
      { type: 'line', group: 'bumblebeeBoys', text: 'He bumps into Porthos, Athos, and Aramis… and is going to duel with all of them!', audio: 'voice/s3/He bumps into.mp3' },
      { type: 'line', group: 'bumblebeeBoys', text: "Dogtanian is ready to show he's the best swordsman.",                             audio: 'voice/s3/Dogtanian is ready to show.mp3' },
      { type: 'line', group: 'bumblebeeBoys', text: "There's going to be trouble in Paris!",                                           audio: "voice/s3/There's going to be trouble in Paris.mp3" },
      { type: 'line', group: 'bumblebeeBoys', text: 'Get ready!',                                                                       audio: 'voice/s3/Get ready.mp3' },
      { type: 'song', title: "Let's Get Ready to Rumble", emoji: '🥊', audio: "music/Let's Get Ready to Rhumble.mp3" },
    ],

// ── Audio engine ───────────────────────────────────────
let _curAudio   = null;
let _curSetIdle = null;
let _seqId      = 0;
let _onSeqAbort = null;

function stopEngine() {
  _seqId++;
  if (_onSeqAbort)  { const fn = _onSeqAbort; _onSeqAbort = null; fn(); }
  if (_curAudio)    { _curAudio.pause(); _curAudio.currentTime = 0; _curAudio = null; }
  if (_curSetIdle)  { const fn = _curSetIdle; _curSetIdle = null; fn(); }
}

async function playEngine(src, onIdle, volume = 1.0) {
  stopEngine();
  const audio = new Audio(src);
  audio.volume = Math.min(1.0, volume);
  _curAudio   = audio;
  _curSetIdle = onIdle;
  const cleanup = () => {
    if (_curAudio === audio) { _curAudio = null; _curSetIdle = null; }
    onIdle();
  };
  audio.onended = cleanup;
  audio.onerror = cleanup;
  await audio.play();
}

async function playSequence(tracks, onDone, onAbort) {
  stopEngine();           // kills previous sequence, fires its onAbort
  _onSeqAbort = onAbort;
  const myId = _seqId;

  for (let i = 0; i < tracks.length; i++) {
    if (_seqId !== myId) return;
    const { src, vol = 1.0 } = tracks[i];
    await new Promise((resolve) => {
      const audio = new Audio(src);
      audio.volume = Math.min(1.0, vol);
      _curAudio   = audio;
      _curSetIdle = resolve;
      const cleanup = () => {
        if (_curAudio === audio) { _curAudio = null; _curSetIdle = null; }
        resolve();
      };
      audio.onended = cleanup;
      audio.onerror = cleanup;
      audio.play().catch(resolve);
    });
    if (_seqId !== myId) return;
    if (i < tracks.length - 1) await new Promise(r => setTimeout(r, 600));
  }
  if (_seqId === myId) { _onSeqAbort = null; onDone(); }
}

// ── Audio play button ──────────────────────────────────
function AudioPlayBtn({ src, color }) {
  const [st, setSt] = useState('idle'); // idle | loading | playing
  const hasAudio = Boolean(src && src.trim());

  const handleClick = async (e) => {
    e.stopPropagation();
    if (!hasAudio) return;
    if (st === 'playing') { stopEngine(); setSt('idle'); return; }
    setSt('loading');
    try {
      await playEngine(src, () => setSt('idle'));
      setSt('playing');
    } catch(err) { console.warn(err); setSt('idle'); }
  };

  const icon = !hasAudio ? '🔇' : st === 'loading' ? '⏳' : st === 'playing' ? '🔊' : '▶';
  return (
    <button
      onClick={handleClick}
      disabled={!hasAudio || st === 'loading'}
      className={`audio-play-btn${st === 'playing' ? ' anim-pulse' : ''}`}
      style={{
        background:  !hasAudio ? '#f1f5f9' : st === 'playing' ? color : color + '22',
        color:       !hasAudio ? '#cbd5e1' : st === 'playing' ? '#fff' : color,
        borderColor: !hasAudio ? '#e2e8f0' : color,
      }}
      title={!hasAudio ? 'Audio coming soon' : st === 'playing' ? 'Stop' : 'Play audio'}
    >{icon}</button>
  );
}

// ── Graduation celebration ─────────────────────────────
const CONF_COLORS = ['#F59E0B','#EC4899','#8B5CF6','#3B82F6','#10B981','#EF4444','#F97316','#FFD700','#e879f9','#38bdf8','#fb7185','#a3e635'];

function GradCelebration() {
  const [capsVisible, setCapsVisible] = React.useState(true);

  React.useEffect(() => {
    const onScroll = () => {
      // Only hide on mobile screens
      if (window.innerWidth <= 640) {
        setCapsVisible(window.scrollY < 100);
      }
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const pieces = React.useMemo(() => {
    const p = [];

    // Stars: 24 pieces, full-width spread, fall down
    for (let i = 0; i < 24; i++) {
      p.push({
        type: 'star', id: `st${i}`,
        icon: ['✨','⭐','💫','🌟'][i % 4],
        sz:    14 + (i * 1481 % 12),
        x:     2 + (i * 4993 % 96),      // 2%–98% viewport width
        dx:   -35 + (i * 2237 % 70),
        dy:   180 + (i * 3571 % 220),    // fall 180–400px down
        dur:   2 + (i * 1327 % 22) / 10,
        delay: (i * 3137 % 40) / 10,
      });
    }

    // Confetti: 40 pieces, full-width, fall down
    for (let i = 0; i < 40; i++) {
      p.push({
        type: 'conf', id: `c${i}`,
        color: CONF_COLORS[i % CONF_COLORS.length],
        w:     5 + (i * 7919 % 7),
        h:     3 + (i * 6271 % 5),
        shape: i % 3,
        x:     1 + (i * 4993 % 98),      // 1%–99% viewport width
        dx:   -50 + (i * 3571 % 100),
        dy:   150 + (i * 5381 % 180),    // fall 150–330px
        rot:  -300 + (i * 7213 % 600),
        dur:   1.8 + (i * 1327 % 22) / 10,
        delay: (i * 3137 % 38) / 10,
      });
    }

    // Caps: left edge (0–14%) and right edge (86–100%) only
    for (let i = 0; i < 10; i++) {
      const onRight = i % 2 === 0;
      const x = onRight
        ? 86 + (i * 4993 % 12)   // 86–98%
        :  2 + (i * 4993 % 12);  //  2–14%
      p.push({
        type: 'cap', id: `cap${i}`,
        x,
        dx:   -15 + (i * 2971 % 30),
        dy:  -(200 + (i * 1847 % 180)),
        rot:  -25 + (i * 3613 % 50),
        sz:    20 + (i * 1973 % 14),
        dur:   2.5 + (i * 2341 % 16) / 10,
        delay: (i * 3137 % 32) / 10,
      });
    }
    return p;
  }, []);

  const caps   = pieces.filter(p => p.type === 'cap');
  const others = pieces.filter(p => p.type !== 'cap');

  const renderCap = p => (
    <div key={p.id} className="grad-cap-fly" style={{
      '--x': `${p.x}%`, '--dx': `${p.dx}px`, '--dy': `${p.dy}px`,
      '--rot': `${p.rot}deg`, '--sz': `${p.sz}px`,
      '--dur': `${p.dur}s`, '--delay': `${p.delay}s`,
    }}>🎓</div>
  );

  return (
    <>
      {/* Caps — behind main content, hidden when scrolled on mobile */}
      <div
        className="grad-caps-layer"
        aria-hidden="true"
        style={{ opacity: capsVisible ? 1 : 0 }}
      >
        {caps.map(renderCap)}
      </div>

      {/* Stars + confetti — above content (z-index: 50) */}
      <div className="grad-celebration" aria-hidden="true" style={{ opacity: capsVisible ? 1 : 0 }}>
        {others.map(p => {
          if (p.type === 'star') return (
            <div key={p.id} className="grad-star" style={{
              '--x': `${p.x}%`, '--sz': `${p.sz}px`,
              '--dx': `${p.dx}px`, '--dy': `${p.dy}px`,
              '--dur': `${p.dur}s`, '--delay': `${p.delay}s`,
            }}>{p.icon}</div>
          );
          return (
            <div key={p.id} className="grad-piece" style={{
              width: p.w, height: p.h,
              background: p.color,
              borderRadius: p.shape === 1 ? '50%' : '2px',
              transform: p.shape === 2 ? 'rotate(45deg)' : 'none',
              '--x': `${p.x}%`, '--dx': `${p.dx}px`, '--dy': `${p.dy}px`,
              '--rot': `${p.rot}deg`, '--dur': `${p.dur}s`, '--delay': `${p.delay}s`,
            }} />
          );
        })}
      </div>
    </>
  );
}

// ── Scene play bar ─────────────────────────────────────
function ScenePlayBar({ scene, color }) {
  const [mode, setMode] = useState('idle'); // idle | lines | all

  const lineTracks = scene.items
    .filter(i => i.type === 'line' && i.audio?.trim())
    .map(i => ({ src: i.audio, vol: 1.0 }));

  const songItem  = scene.items.find(i => i.type === 'song' && i.audio?.trim());
  const songTrack = songItem ? { src: songItem.audio, vol: songItem.vol ?? 1.0 } : null;

  const hasLines = lineTracks.length > 0;
  const hasSong  = Boolean(songTrack);
  const isPlaying = mode !== 'idle';

  const done  = () => setMode('idle');
  const abort = () => setMode('idle');

  const startPlay = async (tracks, m) => {
    if (!tracks.length) return;
    setMode(m);
    await playSequence(tracks, done, abort);
  };

  const stop = () => { stopEngine(); setMode('idle'); };

  const allTracks = [...lineTracks, ...(songTrack ? [songTrack] : [])];

  return (
    <div className="scene-play-bar">
      {isPlaying ? (
        <button onClick={stop} className="scene-seq-stop" style={{ color, borderColor: color + '55' }}>
          ⏹ Stop
        </button>
      ) : (
        <>
          <button
            onClick={() => startPlay(lineTracks, 'lines')}
            disabled={!hasLines}
            className="scene-seq-btn"
            style={{
              background:  hasLines ? color + '15' : '#f1f5f9',
              color:       hasLines ? color : '#94a3b8',
              borderColor: hasLines ? color + '45' : '#e2e8f0',
            }}
          >
            ▶ Play Lines
          </button>
          <button
            onClick={() => startPlay(allTracks, 'all')}
            disabled={!hasLines && !hasSong}
            className="scene-seq-btn"
            style={{
              background:  (hasLines || hasSong) ? color : '#f1f5f9',
              color:       (hasLines || hasSong) ? '#fff' : '#94a3b8',
              borderColor: (hasLines || hasSong) ? color : '#e2e8f0',
            }}
          >
            🎵 Lines + Song
          </button>
        </>
      )}
    </div>
  );
}

  );

      [8,55],[22,62],[38,48],[60,58],[78,50],[92,65],
      [3,75],[20,80],[45,72],[65,78],[82,70],[96,82],
    ];
    positions.forEach(([x, y], i) => {
      const size = 1 + Math.random() * 2;
      stars.push({
        id: i,
        style: {
          left: `${x}%`, top: `${y}%`,
          width: size, height: size,
          '--dur':   `${2.5 + Math.random() * 3}s`,
          '--delay': `${Math.random() * 4}s`,
          '--lo':    0.08 + Math.random() * 0.12,
          '--hi':    0.5  + Math.random() * 0.5,
        }
      });
    });
    return stars;
  }, []);

  return (
    <div className="app-wrap">
      {/* ── Musketeer deco ── */}
      <div className="stage-deco" aria-hidden="true">
        {stageDeco.map((d, i) => (
          <div
            key={i}
            className="stage-deco-item"
            style={{
              left:     `${d.x}%`,
              top:      `${d.y}%`,
              fontSize: d.size,
              opacity:  d.opacity,
              filter:   'blur(0.6px)',
              '--base-transform': `rotate(${d.rotate}deg)`,
              transform: `rotate(${d.rotate}deg)`,
              animation: `decoFloat ${d.dur}s ease-in-out infinite ${d.delay}s`,
            }}
          >
            {d.icon}
          </div>
        ))}
      </div>

      {/* ── Stage stars ── */}
      <div className="stage-stars" aria-hidden="true">
        {stageStars.map(s => <div key={s.id} className="stage-star" style={s.style} />)}
      </div>

      {/* ── Header ── */}
      <header className="app-header">
        <GradCelebration />
        <div className="banner-stars" aria-hidden="true">
          {STARS.map((s, i) => (
            <span key={i} className="banner-star" style={{ animationDelay: `${i * 0.3}s` }}>{s}</span>
          ))}
        </div>
        <span className="header-main-emoji" role="img" aria-label="theater masks">🎭</span>
        <h1 className="app-title">Juliette and the Musketeers!</h1>
        <p className="app-subtitle">K3-5 Graduation Show 🎓 Script Practice</p>
        <p className="app-motto">"One for All and All for One" ⚔️</p>
      </header>

      {/* ── Tab nav ── */}
      {(() => {
        const activeSceneObj = activeScene ? SCENES.find(s => s.id === activeScene) : null;
        const chipLabel = activeGroup
          ? `${GROUPS[activeGroup].emoji} ${GROUPS[activeGroup].label}`
          : activeSceneObj
          ? `${activeSceneObj.emoji} Scene ${activeSceneObj.num}`
          : null;
        const chipColor = activeGroup
          ? GROUPS[activeGroup].color
          : activeSceneObj
          ? GROUPS[activeSceneObj.groups[0]]?.color
          : null;

        const renderSceneBar = () => SCENES.map(scene => {
          const isActive = activeScene === scene.id;
          const color    = GROUPS[scene.groups[0]]?.color || '#64748b';
          return (
            <button
              key={scene.id}
              onClick={() => selectScene(scene.id)}
              className="scene-btn"
              style={{
                background:  isActive ? color : '#f8fafc',
                color:       isActive ? '#fff' : color,
                borderColor: isActive ? color : color + '55',
                boxShadow:   isActive ? `0 2px 8px ${color}38` : 'none',
              }}
            >
              <span className="scene-btn-num">{scene.num}</span>
              <span className="scene-btn-emoji">{scene.emoji}</span>
            </button>
          );
        });

        return (
          <nav className="tab-nav">

            {/* ── Scene bar: always visible (mobile + desktop) ── */}
            <div className="nav-label">Scene</div>
            <div className="scene-bar">{renderSceneBar()}</div>

            <div className="scene-bar-divider" />

            {/* ── Group toggle (mobile only) ── */}
            <button
              className="filter-toggle"
              onClick={() => setFilterOpen(o => !o)}
              aria-expanded={filterOpen}
            >
              <div className="filter-toggle-left">
                <span>👥 Group</span>
                {activeGroup
                  ? <span className="filter-toggle-chip active" style={{ '--chip-color': chipColor }}>{chipLabel}</span>
                  : <span className="filter-toggle-chip">All Groups</span>
                }
              </div>
              <span className={`filter-toggle-chevron${filterOpen ? ' open' : ''}`}>▼</span>
            </button>

            {/* ── Group section: collapsible mobile / always desktop ── */}
            <div className={`filter-body${filterOpen ? ' is-open' : ''}`}>
              <div className="filter-body-inner">
                <div className="nav-label">Group</div>
                <div className="tab-bar">
                  {(() => {
                    const isActive = !activeGroup && !activeScene;
                    return (
                      <button
                        onClick={() => { setActiveGroup(null); setActiveScene(null); setFilterOpen(false); }}
                        className="tab-btn tab-btn-all"
                        style={{
                          background:  isActive ? '#1e293b' : '#f8fafc',
                          color:       isActive ? '#fff' : '#475569',
                          borderColor: isActive ? '#1e293b' : '#cbd5e1',
                          boxShadow:   isActive ? '0 2px 8px rgba(30,41,59,.22)' : 'none',
                        }}
                      >
                        🎬 All Scenes
                      </button>
                    );
                  })()}
                  {Object.entries(GROUPS).map(([key, g]) => {
                    const isActive = activeGroup === key;
                    return (
                      <button
                        key={key}
                        onClick={() => { selectGroup(key); setFilterOpen(false); }}
                        className="tab-btn"
                        style={{
                          background:  isActive ? g.color : '#f8fafc',
                          color:       isActive ? '#fff' : g.color,
                          borderColor: isActive ? g.color : g.color + '66',
                          boxShadow:   isActive ? `0 2px 10px ${g.color}40` : 'none',
                        }}
                      >
                        {g.emoji} {g.label}
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>

          </nav>
        );
      })()}

      <main>
        {/* ── Group banner ── */}
        {groupInfo && (
          <div
            key={activeGroup}
            className="group-banner anim-slideUp"
            style={{ background: groupInfo.bg, borderColor: groupInfo.border }}
          >
            <span className="group-banner-emoji">{groupInfo.emoji}</span>
            <div>
              <div className="group-banner-title" style={{ color: groupInfo.color }}>
                {groupInfo.label}
              </div>
              <div className="group-banner-sub">
                {visibleScenes.length} scene{visibleScenes.length !== 1 ? 's' : ''} · {totalLines} lines
              </div>
            </div>
          </div>
        )}

        {/* ── All-scenes summary bar ── */}
        {!activeGroup && (
          <div
            className="group-banner anim-slideUp"
            style={{ background: '#fff', borderColor: '#e2e8f0', border: '2px solid #e2e8f0' }}
          >
            <span style={{ fontSize: 'clamp(28px, 7vw, 38px)' }}>📜</span>
            <div>
              <div className="group-banner-title" style={{ color: '#1e293b' }}>Full Script</div>
              <div className="group-banner-sub">
                7 scenes · {SCENES.reduce((s, sc) => s + sc.items.filter(i => i.type === 'line').length, 0)} lines total
              </div>
            </div>
          </div>
        )}

        {/* ── Scene list ── */}
        <div>
          {visibleScenes.map((scene, idx) => (
            <div
              key={scene.id}
              className="anim-slideUp"
              style={{ animationDelay: `${idx * 0.06}s` }}
            >
              <SceneCard scene={scene} activeGroup={activeGroup} />
            </div>
          ))}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
